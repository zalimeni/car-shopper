name: Database migrations

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/migrations.yml"
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/migrations.yml"

jobs:
  # Apply all migrations to a throwaway Postgres to prove they run cleanly.
  # No secrets, never touches the real database.
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGURL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply CI shim (Supabase auth schema/roles)
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/ci/shim.sql
      - name: Apply migrations in order
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in supabase/migrations/*.sql; do
            echo "── applying $f"
            psql "$PGURL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Re-apply migrations (idempotency check)
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in supabase/migrations/*.sql; do
            echo "── re-applying $f"
            psql "$PGURL" -v ON_ERROR_STOP=1 -f "$f"
          done

  # Push pending migrations to the real Supabase project on merge to main, via
  # the IPv4 session-mode pooler (GitHub runners are IPv4-only; the direct DB
  # host is IPv6-only without the add-on). CI assembles the pooler URL from the
  # DB password (secret) + region (variable). Dormant until the secret is set.
  apply:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DB_REGION: ${{ vars.SUPABASE_DB_REGION }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'dispkandrvmycwccavvl' }}
    steps:
      - name: Check config
        id: gate
        run: |
          if [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            echo "SUPABASE_DB_PASSWORD not set — skipping apply (validation already passed)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${DB_REGION}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is set but the SUPABASE_DB_REGION variable is missing. Add it (e.g. us-east-1) under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.ready == 'true'
        with:
          version: latest
      - name: Push migrations
        if: steps.gate.outputs.ready == 'true'
        run: |
          ENC_PW=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe=''))")
          DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC_PW}@aws-0-${DB_REGION}.pooler.supabase.com:5432/postgres"
          echo "::add-mask::${ENC_PW}"
          echo "::add-mask::${DB_URL}"
          supabase db push --db-url "$DB_URL"


