name: Database migrations

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/migrations.yml"
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/migrations.yml"

jobs:
  # Start a local Supabase database (the CLI's own Postgres image, with the
  # real auth schema, roles and Realtime publication), apply every migration,
  # re-apply them to prove they are idempotent, then run the pgTAP tests in
  # supabase/tests/. No secrets, never touches the real database.
  validate:
    runs-on: ubuntu-latest
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Start the database and apply migrations
        run: supabase db start
      - name: Re-apply migrations (idempotency check)
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in supabase/migrations/*.sql; do
            echo "── re-applying $f"
            psql "$PGURL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: pgTAP tests (RLS, grants, save_app_state)
        run: supabase test db

  # Push pending migrations to the real Supabase project on merge to main, via
  # the IPv4 session-mode pooler (GitHub runners are IPv4-only; the direct DB
  # host is IPv6-only without the add-on). Dormant until SUPABASE_DB_URL is set.
  apply:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check for credentials
        id: gate
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "SUPABASE_DB_URL not set — skipping apply (validation already passed)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.gate.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.ready == 'true'
        with:
          version: 2.122.1
      - name: Push migrations
        if: steps.gate.outputs.ready == 'true'
        # --yes: newer CLIs ask before applying and refuse when there's no terminal.
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes


