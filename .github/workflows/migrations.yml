name: Database migrations

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/migrations.yml"
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/migrations.yml"

jobs:
  # Apply all migrations to a throwaway Postgres to prove they run cleanly.
  # No secrets, never touches the real database.
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGURL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply CI shim (Supabase auth schema/roles)
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/ci/shim.sql
      - name: Apply migrations in order
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in supabase/migrations/*.sql; do
            echo "── applying $f"
            psql "$PGURL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Re-apply migrations (idempotency check)
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in supabase/migrations/*.sql; do
            echo "── re-applying $f"
            psql "$PGURL" -v ON_ERROR_STOP=1 -f "$f"
          done

  # Push pending migrations to the real Supabase project on merge to main, via
  # the IPv4 session-mode pooler (GitHub runners are IPv4-only; the direct DB
  # host is IPv6-only without the add-on). Dormant until SUPABASE_DB_URL is set.
  apply:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check for credentials
        id: gate
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "SUPABASE_DB_URL not set — skipping apply (validation already passed)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.ready == 'true'
        with:
          version: latest
      - name: Push migrations
        if: steps.gate.outputs.ready == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL"


