<!-- Supabase Dashboard → Authentication → Emails → "Magic Link" template (body).
     Hosted projects don't read this file: paste it there. It keeps the link (works in
     any browser tab) and adds the one-time code, which is what signs in an iPhone
     Home Screen web app — email links always open in Safari, whose storage the Home
     Screen app doesn't share. -->
<h2>Sign in to Car Shopper</h2>
<p>Your sign-in code:</p>
<p style="font-size:28px;font-weight:600;letter-spacing:6px;font-family:monospace">{{ .Token }}</p>
<p>Type it into the app — this is the way to sign in from a Home Screen bookmark.</p>
<p>Or, in a browser, <a href="{{ .ConfirmationURL }}">tap here to sign in</a>.</p>
<p style="color:#888;font-size:12px">The code and link expire soon and work once. If you didn't ask to sign in, ignore this email.</p>
