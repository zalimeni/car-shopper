<!-- Optional: a Tirekicker-branded body for Supabase Dashboard → Authentication →
     Emails → "Magic Link". Hosted projects don't read this file, and editing
     templates needs custom SMTP — the default template works as is. It adds the
     Home Screen tip: email links always open in Safari, whose storage the Home
     Screen web app doesn't share, so there you copy the link and paste it into
     the app instead of tapping it. -->
<h2>Sign in to Tirekicker</h2>
<p><a href="{{ .ConfirmationURL }}">Tap here to sign in</a>.</p>
<p>Using the app from your Home Screen? Don't tap: long-press the link, choose Copy Link, and paste it into the app.</p>
<p style="color:#888;font-size:12px">The link expires soon and works once. If you didn't ask to sign in, ignore this email.</p>
