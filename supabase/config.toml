# Supabase CLI config for local development and CI (`supabase db start`,
# `supabase test db`). `project_id` is just a local label; CI selects the
# production project with --db-url. Settings not listed here use the CLI's
# defaults (`supabase init` writes the full file if you want to edit them).
project_id = "car-shopper"

[db]
port = 54322
# The Supabase CLI ships Postgres 15 and 17 images (no 16). Keep this equal
# to the hosted project's major version (Dashboard → Settings → Infrastructure).
major_version = 17

[db.seed]
enabled = false
